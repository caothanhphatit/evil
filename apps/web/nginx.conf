server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /session/ {
    set $world_backend http://server:8080;
    proxy_pass $world_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /account/ {
    set $world_backend http://server:8080;
    proxy_pass $world_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ready {
    set $world_ready_backend http://server:8080/ready;
    proxy_pass $world_ready_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ws {
    set $world_ws_backend http://server:8080;
    proxy_pass $world_ws_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /game-assets/ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
