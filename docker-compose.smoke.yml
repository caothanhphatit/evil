services:
  postgres:
    ports: !override
      - "25432:5432"

  redis:
    ports: !override
      - "26379:6379"

  server:
    environment:
      WEB_ORIGIN: http://localhost:25173
    ports: !override
      - "28080:8080"

  web:
    environment:
      VITE_WORLD_WS_URL: ws://localhost:28080/ws
    ports: !override
      - "25173:5173"
